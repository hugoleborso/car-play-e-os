//
// Clean-room protocol definitions for the Android Auto Protocol (AAP).
//
// These messages describe observable facts about a wire protocol: field
// numbers, wire types and enum values are dictated by interoperability, not
// authored expression. They were derived from public protocol documentation and
// from traffic analysis against our own head-unit emulator. No proprietary
// source, header or generated descriptor was copied to produce them.
//
// Names are ours. Where the original naming is unknown we chose a descriptive
// name rather than guessing at Google's internal identifiers.

syntax = "proto2";

package openaap;

option java_package = "org.openaap.protocol.proto";
option java_outer_classname = "Common";
option java_multiple_files = true;

// Result code carried by most *Response messages on the control channel.
enum StatusCode {
  STATUS_OK = 0;
  STATUS_UNSOLICITED_MESSAGE = 1;
  STATUS_INVALID_SERVICE = 2;
  STATUS_INVALID_CHANNEL = 3;
  STATUS_INVALID_MESSAGE = 4;
  STATUS_UNEXPECTED_MESSAGE = 5;
  STATUS_INTERNAL_ERROR = 6;
}
