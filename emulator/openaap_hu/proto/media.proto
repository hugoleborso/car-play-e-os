//
// A/V channel messages, head-unit side.
//
// Names here are ours. docs/01-aap-wire-format.md is explicit that field
// numbers and byte offsets are dictated by the wire format while identifiers
// are creative choices, so nothing in this file borrows a name from any
// existing Android Auto project.
//
// Field numbers: the specification pins field numbers for exactly one message,
// the channel entry in descriptors.proto. Everywhere else -- including this
// file -- the numbering below is this implementation's own choice, assigned in
// the order the fields are described in prose. See docs/08-emulator.md for why
// that matters.

syntax = "proto2";

package openaap.hu.v1;

// Which of the two media flavours a channel carries. The value is meaningful
// only as a discriminator; the media bytes themselves are unframed (H.264
// Annex-B, or signed 16-bit little-endian PCM).
enum StreamKind {
  STREAM_UNSET = 0;
  STREAM_SOUND = 1;
  STREAM_PICTURE = 2;
}

// Resolutions travel as enum indices rather than pixel counts, so a head unit
// can only offer geometries the protocol has an index for.
enum PictureGeometry {
  GEOMETRY_UNSET = 0;
  GEOMETRY_800_480 = 1;
  GEOMETRY_1280_720 = 2;
  GEOMETRY_1920_1080 = 3;
}

// Likewise for frame rate. Indices of 4 and above are known to exist on modern
// head units and are undocumented, so they are deliberately absent rather than
// guessed at.
enum PictureCadence {
  CADENCE_UNSET = 0;
  CADENCE_30 = 1;
  CADENCE_60 = 2;
}

// Which mix a sound sink feeds. A head unit ducks or mutes these against each
// other independently.
enum SoundLane {
  LANE_UNSET = 0;
  LANE_PROGRAM = 1;
  LANE_GUIDANCE = 2;
  LANE_ALERT = 3;
}

enum SetupOutcome {
  SETUP_UNSET = 0;
  SETUP_ACCEPTED = 1;
  SETUP_REFUSED = 2;
}

// Who owns the car screen.
enum ScreenFocusState {
  SCREEN_FOCUS_UNSET = 0;
  SCREEN_FOCUS_PROJECTED = 1;
  SCREEN_FOCUS_NATIVE = 2;
}

message PictureFormat {
  optional PictureGeometry geometry = 1;
  optional PictureCadence cadence = 2;
  // Letterboxing the head unit applies before display, in pixels.
  optional uint32 pad_left = 3;
  optional uint32 pad_top = 4;
  optional uint32 density_dpi = 5;
  // How far behind real time the head unit's decoder runs, in milliseconds.
  optional uint32 decoder_delay_ms = 6;
}

message SoundFormat {
  optional uint32 sample_rate = 1;
  optional uint32 sample_bits = 2;
  optional uint32 lane_count = 3;
}

// Phone -> head unit, id 0x8000.
message StreamSetupRequest {
  // Index into the format list the head unit advertised for this channel.
  optional uint32 format_index = 1;
}

// Head unit -> phone, id 0x8003.
message StreamSetupReply {
  optional SetupOutcome outcome = 1;
  // The credit window: how many media messages may be in flight unacknowledged.
  optional uint32 max_unacked = 2;
  repeated uint32 granted_format_index = 3;
}

// Phone -> head unit, id 0x8001. The tag is echoed in every acknowledgement so
// a late ack from a previous session can be told apart from a current one.
message StreamStartNotice {
  optional int32 session_tag = 1;
  optional uint32 target_gain = 2;
}

// Phone -> head unit, id 0x8002.
message StreamStopNotice {
  optional int32 session_tag = 1;
}

// Head unit -> phone, id 0x8004. Releases credit back to the sender.
message MediaConsumedNotice {
  optional int32 session_tag = 1;
  optional uint64 stamp_us = 2;
  // One entry per media message being released. A batched acknowledgement
  // carries several.
  repeated uint32 released = 3;
}

// Phone -> head unit, id 0x8007.
message ScreenFocusRequest {
  optional uint32 display_index = 1;
  optional ScreenFocusState wanted = 2;
}

// Head unit -> phone, id 0x8008. The video channel may not start until this
// arrives; audio channels have no equivalent gate.
message ScreenFocusNotice {
  optional ScreenFocusState state = 1;
  // True when the head unit volunteered the change rather than answering a
  // request, e.g. the driver pressed the radio button.
  optional bool unprompted = 2;
}

// Phone -> head unit, id 0x8005. The microphone channel runs the other way:
// the head unit sends media and the phone acknowledges it.
message MicrophoneOpenRequest {
  optional bool open = 1;
  optional bool noise_suppression = 2;
}

// Head unit -> phone, id 0x8006.
message MicrophoneOpenReply {
  optional int32 outcome = 1;
  optional bool open = 2;
}
