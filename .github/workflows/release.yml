name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :android:app:assembleDebug :android:app:lintDebug --stacktrace

      - name: Name the artefact after the build
        id: build
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          short=$(git rev-parse --short HEAD)
          name="openaap-${version}-${short}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$name"
          {
            echo "apk=$name"
            echo "version=$version"
            echo "short=$short"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: openaap-apk
          path: ${{ steps.build.outputs.apk }}

      - name: Write the release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## Install

          Download the `.apk` below and open it on the phone. Android will ask
          whether to allow installing from wherever you downloaded it; say yes.

          Or from a computer: `adb install -r openaap-*.apk`

          Needs Android 10 or later. No Play Services, no Google account, no
          root, no custom ROM.

          ## What it does

          It **measures**, it does not project. Plug the phone into a car's data
          USB port and the app presents a series of generated identities to the
          car, one per connection, recording how far each one got and what the
          car said when it stopped. That question — what a production head unit
          actually checks about a phone's certificate — has no published answer
          after eleven years of community work.

          The app's screen shows results as they arrive, which matters because
          the cable is in the car and a computer cannot see the phone while it
          is happening. Press **Share report** when it is done.

          Full procedure: [field test protocols](https://github.com/OWNER_REPO/blob/main/docs/11-field-test-protocols.md).

          ## About the signature

          Signed with Android's standard debug key. That is deliberate for a
          sideloaded diagnostic tool: no secret lives in this repository and the
          build is reproducible from source. It does mean Android will refuse to
          update it over a differently-signed build, and that it is unsuitable
          for an app store. Neither matters here.

          ## What it does not do

          Nothing here has run against physical hardware yet, and it does not
          send video or audio to a car. That pipeline is unfinished.
          NOTES
          sed -i "s|OWNER_REPO|${GITHUB_REPOSITORY}|" release-notes.md

      # A rolling release rather than a tagged one, so that /releases/latest is
      # always the current build and nobody has to cut a tag to make the app
      # downloadable. Delete and recreate rather than update in place: moving a
      # tag on an existing release is the part of this that is fiddly, and
      # recreating is both simpler and idempotent.
      - name: Publish the rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --title "openaap ${{ steps.build.outputs.version }} (${{ steps.build.outputs.short }})" \
            --notes-file release-notes.md \
            "${{ steps.build.outputs.apk }}"

      - name: Publish a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "openaap ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${{ steps.build.outputs.apk }}"
