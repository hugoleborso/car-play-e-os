name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :android:app:assembleDebug :android:app:lintDebug --stacktrace

      - name: Name the artefact after the build
        id: build
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          short=$(git rev-parse --short HEAD)
          name="openaap-${version}-${short}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$name"
          {
            echo "apk=$name"
            echo "version=$version"
            echo "short=$short"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: openaap-apk
          path: ${{ steps.build.outputs.apk }}

      - name: Write the release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## Install

          Download the `.apk` below and open it on the phone. Android will ask
          whether to allow installing from wherever you downloaded it; say yes.

          Or from a computer: `adb install -r openaap-*.apk`

          Needs Android 10 or later. No Play Services, no Google account, no
          root, no custom ROM.

          **Check you got it.** The app prints `vVERSION · build COMMIT` under
          its title, and it must match this release. Testing an old build in a
          car park is a wasted trip that looks exactly like a failed experiment.

          ## What it does

          Three jobs, chosen with a button on the app's own screen — the cable is
          in the car when it matters, so nothing important hides behind `adb`.

          **Certificates** presents nine generated identities, one per
          connection, and records how each is answered. On the one car tested so
          far this is answered: all nine refused, identically.

          **Status** holds the certificate constant and breaks the session seven
          other ways — refusing before TLS, failing the handshake outright,
          sending a malformed version response — to find out whether the refusal
          code changes. This is the open question and the default.

          **Projection** sends a picture to the car screen. Worth trying only
          once a car has been seen accepting an identity.

          Results appear on the phone as they arrive, because a computer cannot
          see the phone while the interesting part is happening. **Share report**
          sends the summary and the raw records together.

          Full procedure: [field test protocols](https://github.com/OWNER_REPO/blob/main/docs/11-field-test-protocols.md).

          ## What has actually been observed

          **A correction first.** Releases before 0.6.0 said this head unit had
          accepted certificates we generated. That was wrong and is retracted.
          It was refusing every one of them, and our decoder turned the refusal
          into an acceptance: the car answers with `status = -3`, our schema
          declared that field as an enum whose members are 0 and 1, and proto2
          reports an out-of-range enum value as an *absent* field — which the
          code then read as "nothing to object to".

          What a production VW MIB2 does, corrected: it completes a TLS 1.2
          handshake against a certificate we generate, adapting its cipher suite
          to an elliptic-curve identity, then refuses the session with
          `status = -3` and drops USB a few seconds later. Nine identities
          varying structure, chain depth, validity window, key size and key
          algorithm all got the same refusal. It speaks AAP protocol 1.0.

          **What `-3` means is unknown.** No public source documents it. It may
          be "certificate refused", in which case it locates the trust wall
          exactly; it may be generic, in which case it locates nothing. This
          build carries the matrix that tries to tell those apart, by holding
          the certificate constant and breaking the session seven other ways.

          There is no positive control and there cannot be one — a session this
          car accepts would need a Google-signed certificate this project will
          not obtain. Every result is a comparison between kinds of failure.

          ## About the signature

          Signed with Android's standard debug key. That is deliberate for a
          sideloaded diagnostic tool: no secret lives in this repository and the
          build is reproducible from source. It does mean Android will refuse to
          update it over a differently-signed build, and that it is unsuitable
          for an app store. Neither matters here.

          ## What it does not do

          **No audio.** There is no audio source yet, and capturing another
          app's output needs a consent dialog that cannot be raised from a car.

          **No third-party apps on the car screen.** It projects its own
          interface, not the phone's display or someone else's map. That is a
          consequence of staying an ordinary APK: mirroring arbitrary content
          means injecting input events, which needs a signature permission only
          a platform-signed build can hold. Android Auto also projects its own
          interface rather than the phone's screen, so the limitation is
          narrower than it sounds.

          **The projection path has run against real hardware and never
          streamed a frame.** Sessions reach authentication and are refused
          there, so nothing downstream of that — encoder, renderer, touch
          input — has ever been exercised by a car. It is written and tested
          against an emulator, and untested where it counts.
          NOTES
          sed -i "s|OWNER_REPO|${GITHUB_REPOSITORY}|" release-notes.md
          sed -i "s|VERSION|${{ steps.build.outputs.version }}|" release-notes.md
          sed -i "s|COMMIT|${{ steps.build.outputs.short }}|" release-notes.md

      # A rolling release rather than a tagged one, so that /releases/latest is
      # always the current build and nobody has to cut a tag to make the app
      # downloadable. Delete and recreate rather than update in place: moving a
      # tag on an existing release is the part of this that is fiddly, and
      # recreating is both simpler and idempotent.
      - name: Publish the rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --title "openaap ${{ steps.build.outputs.version }} (${{ steps.build.outputs.short }})" \
            --notes-file release-notes.md \
            "${{ steps.build.outputs.apk }}"

      - name: Publish a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "openaap ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${{ steps.build.outputs.apk }}"
