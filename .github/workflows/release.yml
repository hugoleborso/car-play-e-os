name: Release

on:
  push:
    tags: ["v*"]
  # So a build can be published without cutting a tag, which is what you want
  # when someone is about to drive to a car park and needs the current APK.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :android:app:assembleDebug :android:app:lintDebug --stacktrace

      - name: Name the artefact after the build
        id: name
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          short=$(git rev-parse --short HEAD)
          name="openaap-${version}-${short}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "apk=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Attached to every run, tag or not, so the current build is always one
      # click away for anyone with repository access.
      - uses: actions/upload-artifact@v4
        with:
          name: openaap-apk
          path: ${{ steps.name.outputs.apk }}

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.apk }}
          name: openaap ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Install

            Download the `.apk` below, then on the phone:

            - open it from the notification or a file manager, and allow
              installation from that source when asked, **or**
            - `adb install -r openaap-*.apk` from a computer.

            Requires Android 10 or later. On a de-Googled ROM nothing else is
            needed; there is no Play Services dependency anywhere in this app.

            ## What it does

            The app starts in probe mode. Plug the phone into a car's data USB
            port and it presents a series of generated identities to the head
            unit, one per connection, recording how far each one got and what
            the head unit said when it stopped. The screen shows this live —
            which matters, because the cable is in the car and `adb` cannot see
            the phone while it is happening.

            Full procedure: [field test protocols](https://github.com/${{ github.repository }}/blob/main/docs/11-field-test-protocols.md).

            ## About the signature

            This APK is signed with Android's standard debug key. That is
            deliberate for a diagnostic tool people sideload: it needs no
            secret held in this repository, and anyone can reproduce the build
            byte for byte from the tagged source. It also means Android will
            refuse to update it over a differently-signed build, and it is not
            suitable for distribution through an app store. Neither matters
            here.

            ## What it does not do

            Nothing in this app has run against physical hardware yet. It does
            not project video or audio to a car — that pipeline is unfinished.
            It measures what a head unit checks about a phone's certificate,
            which is an open question nobody has published an answer to.
