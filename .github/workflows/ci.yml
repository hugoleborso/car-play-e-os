name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  jvm:
    name: JVM protocol stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # No Android SDK is installed on purpose. The entire protocol
      # implementation lives in pure-JVM modules precisely so that it stays
      # testable without one, and this job fails if that ever stops being true.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jvm-test-reports
          path: "**/build/reports/tests/**"

  emulator:
    name: Head-unit emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r emulator/requirements.txt

      - name: Test
        run: python -m pytest emulator/tests -q

  interop:
    name: Phone against emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install emulator dependencies
        run: pip install -r emulator/requirements.txt

      # The load-bearing test. The Kotlin phone side and the Python head-unit
      # side were written separately from the same written spec; this runs them
      # against each other over a real socket. A disagreement here is a
      # disagreement that would otherwise only surface in a car, silently.
      - name: End-to-end session
        run: ./gradlew :harness:test --tests "*Interop*" --stacktrace

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: interop-reports
          path: "**/build/reports/tests/**"
